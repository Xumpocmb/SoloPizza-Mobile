<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Solo Pizza — веб-превью</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>" />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #f8f9fa; font-family: -apple-system, Roboto, sans-serif; }
      /* 04.11.2026: КЛЮЧЕВАЯ СТРОКА веб-превью. В React Native корневой View
         растягивается на экран сам, а в браузере #root — обычный block-div:
         дочерний View c flex:1 сворачивался в высоту 0 и страница была пустой
         (DOM при этом полный). Flex-контейнер из #root чинит всю цепочку. */
      #root { display: flex; flex-direction: column; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
